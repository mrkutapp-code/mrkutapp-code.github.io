<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Garden challenge</title>
<meta name="robots" content="noindex">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f6efe0; color: #243c20; text-align: center; }
  main { max-width: 420px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  p { color: #51603f; line-height: 1.5; }
  .code { font: 700 28px ui-monospace, monospace; letter-spacing: 2px; background: #fff8ec; border: 2px solid #ebd9b6; border-radius: 16px; padding: 14px; margin: 20px 0; }
  a.btn { display: block; background: #4f7a3a; color: #fff; text-decoration: none; font-weight: 700; padding: 16px; border-radius: 28px; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1 id="title">A friend challenged you</h1>
  <p id="body">Play the same five boards in Memory Garden and try to beat their score.</p>
  <div class="code" id="code"></div>
  <a class="btn" id="get" href="https://play.google.com/store/apps/details?id=com.mrkutapp.memorygarden">Get Memory Garden</a>
  <p id="hint">Already have the game? Open Memory games, tap "Enter a code" and type the code above.</p>
</main>
<script>
  // The app opens these links itself once installed (Android App Links). Without it, this page
  // sends the code through the Play install referrer, so the challenge is waiting after install.
  var raw = new URLSearchParams(location.search).get("k") || "";
  var code = raw.toUpperCase().replace(/[^0-9A-Z-]/g, "").slice(0, 16);
  var store = "https://play.google.com/store/apps/details?id=com.mrkutapp.memorygarden";
  if (code) {
    document.getElementById("code").textContent = code;
    store += "&referrer=" + encodeURIComponent("utm_source=challenge&utm_content=" + code);
  } else {
    document.getElementById("code").style.display = "none";
  }
  document.getElementById("get").href = store;
  if (/^tr\b/i.test(navigator.language)) {
    document.getElementById("title").textContent = "Bir arkadaşın sana meydan okudu";
    document.getElementById("body").textContent = "Memory Garden'da aynı beş tahtayı oyna ve skorunu geçmeye çalış.";
    document.getElementById("get").textContent = "Memory Garden'ı indir";
    document.getElementById("hint").textContent = "Oyun zaten yüklü mü? Hafıza oyunları'nı aç, \"Kod gir\"e dokun ve yukarıdaki kodu yaz.";
  }
  if (code && /Android/i.test(navigator.userAgent)) setTimeout(function () { location.replace(store); }, 1200);
</script>
</body>
</html>
